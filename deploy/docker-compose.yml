# Three containers (PLAN Part 12). Only `frontend` (Caddy) publishes ports.
# `backend` and `ollama` have no `ports:` on purpose: they are reachable only on
# the internal Docker network (task SEC3). Never add one.
# Run from this folder:  docker compose up -d --build
# Then, from another machine:  sh check_public.sh <domain>

services:
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      LLM_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-}
      # Demo only (DECISIONS D-037): when set, Gemini is used instead of the local model.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      WORLDS_DIR: /worlds
    volumes:
      - worlds:/worlds
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  caddy_data:
  caddy_config:
  worlds:
  ollama:
